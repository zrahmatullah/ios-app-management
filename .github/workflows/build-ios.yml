name: Build Lumina iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Go Core Framework
        run: |
          mkdir -p ios/Frameworks
          cd core
          gomobile bind -target=ios,iossimulator -o ../ios/Frameworks/LuminaCore.xcframework ./bridge

      - name: Build iOS App (.ipa / unsigned payload)
        run: |
          cd ios
          xcodebuild -project Lumina.xcodeproj -scheme Lumina -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/Payload
          cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "Lumina.app" | head -n 1) build/Payload/
          cd build && zip -r Lumina.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-iOS-IPA
          path: ios/build/Lumina.ipa
