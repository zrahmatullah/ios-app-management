name: Build Lumina iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      - name: Build Go Core Framework
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p ios/Frameworks
          cd core
          gomobile bind -v -target=ios -o ../ios/Frameworks/LuminaCore.xcframework lumina/core/bridge || true

      - name: Build iOS App (.ipa unsigned payload)
        run: |
          cd ios
          xcodebuild -project Lumina.xcodeproj -scheme Lumina -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES -derivedDataPath ./build/DerivedData build
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build/DerivedData -name "Lumina.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build && zip -r Lumina.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-iOS-IPA
          path: ios/build/Lumina.ipa
