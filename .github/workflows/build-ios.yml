name: Build Lumina iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      - name: Install Gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH=$(go env GOPATH)/bin:$PATH
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Go Core Framework
        run: |
          mkdir -p ios/Frameworks
          cd core
          which gomobile
          gomobile bind -v -target=ios,iossimulator -o ../ios/Frameworks/LuminaCore.xcframework lumina/core/bridge

      - name: Build iOS App (.ipa unsigned payload)
        run: |
          cd ios
          xcodebuild -project Lumina.xcodeproj -scheme Lumina -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ./build/DerivedData build
          mkdir -p ./build/Payload
          cp -R ./build/DerivedData/Build/Products/Release-iphoneos/Lumina.app ./build/Payload/
          cd ./build && zip -r Lumina.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-iOS-IPA
          path: ios/build/Lumina.ipa
