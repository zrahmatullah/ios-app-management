name: Build Lumina iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      - name: Build Go Core Framework
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p ios/Frameworks
          cd core
          gomobile bind -v -target=ios -o ../ios/Frameworks/LuminaCore.xcframework lumina/core/bridge || true

      - name: Build iOS App (.ipa unsigned payload)
        run: |
          cd ios
          mkdir -p build
          xcodebuild archive \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "build/Unsigned.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee /tmp/xcodebuild.log || \
          xcodebuild \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath ./build/DerivedData build \
            2>&1 | tee -a /tmp/xcodebuild.log
          
          mkdir -p build/Payload
          APP_PATH=$(find build -name "Lumina.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Lumina.app was not found!"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r Lumina.ipa Payload
          echo "IPA built successfully at: $(pwd)/Lumina.ipa"

      - name: Print Xcode Build Log
        if: always()
        run: |
          if [ -f /tmp/xcodebuild.log ]; then
            echo "## Xcode Log Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/xcodebuild.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=== FULL LOG ERRORS ==="
            grep -i -C 3 "error:" /tmp/xcodebuild.log || tail -n 60 /tmp/xcodebuild.log
          fi

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-iOS-IPA
          path: ios/build/Lumina.ipa

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: /tmp/xcodebuild.log
